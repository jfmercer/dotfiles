# Upstream code fetched by chezmoi. Every entry is pinned to an exact commit and
# checksummed.
#
# WHY: these files are sourced into every interactive shell and every tmux
# session. Tracking `master` with no integrity check meant anyone able to push to
# any one of these repos -- or intercept a raw.githubusercontent.com response --
# got arbitrary code execution here, automatically, within the refreshPeriod.
# A checksum turns that into a loud failure instead.
#
# WHY COMMITS AND NOT TAGS: several of these projects stopped tagging years ago
# while master kept moving (tmux-yank's last release is from 2018, five years
# behind its master). Pinning to the latest tag would silently roll those
# plugins back. A commit SHA is content-addressed, so it is at least as strong a
# guarantee as a tag -- tags can be force-moved, commits cannot. The comment
# above each entry records the date and nearest tag for human orientation.
#
# BUMPING: not automatic; Dependabot does not read this file. To bump one:
#   sha=$(gh api repos/<owner>/<repo>/commits/HEAD --jq .sha)
#   curl -fsSL https://github.com/<owner>/<repo>/archive/$sha.tar.gz | shasum -a 256
# Then `chezmoi apply --refresh-externals` and confirm it exits 0.

# vim plugin manager
".vim/autoload/plug.vim":
    type: "file"
    url: "https://raw.githubusercontent.com/junegunn/vim-plug/0.14.0/plug.vim"
    refreshPeriod: "168h"
    checksum:
        sha256: "20b4c895f98d13848204698068c4dd031730d4e7c9c4b630d6273b9b9afcdcdb"

