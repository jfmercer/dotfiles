# Upstream code fetched by chezmoi. Every entry is pinned to a tag (or a commit
# where upstream publishes no tags) and checksummed.
#
# WHY: these files are sourced into every interactive shell and every tmux
# session. Tracking `master` with no integrity check meant that anyone who could
# push to any one of these repos -- or intercept a raw.githubusercontent.com
# response -- got arbitrary code execution here, automatically, within the
# refreshPeriod. A checksum turns that into a loud failure instead.
#
# BUMPING: refs are not updated automatically (Dependabot does not read this
# file). To bump one, change the ref and recompute:
#   curl -fsSL https://github.com/<owner>/<repo>/archive/<ref>.tar.gz | shasum -a 256
# Then `chezmoi apply --refresh-externals` and confirm it exits 0.
#
# NOTE: GitHub's auto-generated archive tarballs are stable in practice but have
# been regenerated once historically (2023), which invalidates checksums en
# masse. If several entries fail at once with a checksum mismatch and the refs
# are unchanged, suspect that rather than a compromise -- verify, then recompute.

# vim plugin manager
".vim/autoload/plug.vim":
    type: "file"
    url: "https://raw.githubusercontent.com/junegunn/vim-plug/0.14.0/plug.vim"
    refreshPeriod: "168h"
    checksum:
        sha256: "20b4c895f98d13848204698068c4dd031730d4e7c9c4b630d6273b9b9afcdcdb"

