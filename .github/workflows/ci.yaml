name: 'CI'

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# Cancel in-progress runs when a newer commit is pushed to the same ref
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

# Least privilege by default. Without this block every job inherits the
# repository's default_workflow_permissions, which is "write" -- so `bootstrap`
# (which pipes a curl'd script into bash) and `apply` (which executes this whole
# tree) were handed a read/write GITHUB_TOKEN they have no use for. Jobs that
# need more must opt in explicitly; none currently do.
permissions:
  contents: read

jobs:
  # Lint the shell we own. Deliberately strict: the tree is clean at the time
  # this was added, so any new finding is a regression.
  # Matrixed over both OSes on purpose: .chezmoiscripts/{darwin,linux}/ templates
  # render to an empty string on the other platform and are skipped, so a
  # single-OS lint job would silently never check half of them.
  lint:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      # Pinned to a commit, not the v7.0.1 tag. Same reasoning as
      # .chezmoiexternal.yaml: a tag can be force-moved by anyone who can push
      # to the action's repo, a commit cannot. The hash is also what makes the
      # pin auditable at all -- zizmor's impostor-commit, ref-version-mismatch
      # and stale-action-refs checks have nothing to inspect on a tag pin. The
      # trailing comment is not decoration: ref-version-mismatch verifies it
      # against the commit, and `bump-deps` rewrites both together.
      #
      # persist-credentials: false keeps the token out of .git/config. It
      # matters most in `apply`, which copies this checkout -- .git included --
      # into ~/.local/share/chezmoi.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned to one version from upstream releases rather than each platform's
      # package manager. Ubuntu's apt shellcheck lags Homebrew's by several
      # releases, and the two disagree about which findings to report -- so an
      # unpinned gate passes on one runner and fails on the other for identical
      # code. Bump: gh api repos/koalaman/shellcheck/releases/latest --jq .tag_name
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          case "$RUNNER_OS-$(uname -m)" in
            macOS-arm64)   plat=darwin.aarch64 ;;
            macOS-x86_64)  plat=darwin.x86_64 ;;
            Linux-aarch64) plat=linux.aarch64 ;;
            *)             plat=linux.x86_64 ;;
          esac
          url="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.${plat}.tar.xz"
          curl -fsSL "$url" | tar -xJf - -C /tmp
          sudo install "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      # shellcheck cannot parse zsh, so none of the steps below look at the ~25
      # files that get sourced into every interactive shell. That was a real
      # hole: a parse error in, say, system/alii.zsh does NOT hard-fail the
      # shell -- zsh reports it and carries on, silently dropping everything
      # after the error -- so a broken topic file would ship green and surface
      # later as "some of my aliases vanished".
      #
      # `zsh -n` parses without executing, which is the only safe option here:
      # these files modify PATH, install hooks, and start the prompt.
      - name: Syntax-check zsh files
        run: |
          if ! command -v zsh >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "Linux" ]; then
              sudo apt-get update && sudo apt-get install -y zsh
            else
              echo "zsh not found and no install path for $RUNNER_OS" >&2
              exit 1
            fi
          fi
          zsh --version

          # Derived, not hardcoded, so a newly added topic file is covered
          # automatically rather than silently skipped.
          files=()
          for f in dot_zshrc dot_zshenv; do
            [ -f "$f" ] && files+=("$f")
          done
          for f in */*.zsh; do
            [ -f "$f" ] && files+=("$f")
          done
          for f in bin/*; do
            [ -f "$f" ] || continue
            head -1 "$f" | grep -q 'zsh' && files+=("$f")
          done

          if [ "${#files[@]}" -eq 0 ]; then
            echo "no zsh files found -- the globs above are wrong" >&2
            exit 1
          fi

          rc=0
          for f in "${files[@]}"; do
            if zsh -n "$f" 2>/tmp/zsherr; then
              echo "  ok   $f"
            else
              echo "  FAIL $f"
              sed 's/^/       /' /tmp/zsherr
              rc=1
            fi
          done
          echo "checked ${#files[@]} zsh file(s)"
          exit $rc

      - name: Shellcheck plain scripts
        run: |
          # Select by shebang so .ps1 (pwsh) and bin/time-startup (zsh) are skipped.
          # .chezmoiscripts/*.sh are included: the non-template scripts there are
          # ordinary shell and would otherwise fall through both this glob and the
          # rendered-template step below.
          for f in install.sh scripts/*.sh bin/* .chezmoiscripts/*.sh tests/run; do
            [ -f "$f" ] || continue
            head -1 "$f" | grep -qE '^#!.*(/bash|/sh| bash| sh)$' && printf '%s\0' "$f"
          done > /tmp/shfiles
          echo "Linting:"; tr '\0' '\n' < /tmp/shfiles | sed 's/^/  /'
          xargs -0 --no-run-if-empty shellcheck < /tmp/shfiles

      # The shellcheck steps select files by shebang, so anything with a
      # `#!/usr/bin/env python3` line is skipped entirely and would otherwise go
      # unchecked. py_compile is stdlib -- no new CI dependency.
      - name: Syntax-check Python scripts
        run: |
          found=0
          for f in bin/* scripts/*; do
            [ -f "$f" ] || continue
            head -1 "$f" | grep -q 'python3' || continue
            echo "  $f"
            python3 -m py_compile "$f"
            found=$((found + 1))
          done
          echo "checked $found Python script(s)"
          # Don't leave byte-cache behind for the drift check in the apply job.
          rm -rf bin/__pycache__ scripts/__pycache__

      # py_compile above only proves the file parses. ruff catches what parsing
      # cannot: dead imports (it found two), plus the bandit-derived `S` rules.
      # Pinned and tracked by `bump-deps`, like shellcheck; note the tag has no
      # `v` prefix upstream.
      - name: Install ruff
        env:
          RUFF_VERSION: 0.16.5
        run: |
          case "$RUNNER_OS-$(uname -m)" in
            macOS-arm64)   target=aarch64-apple-darwin ;;
            macOS-x86_64)  target=x86_64-apple-darwin ;;
            Linux-aarch64) target=aarch64-unknown-linux-gnu ;;
            *)             target=x86_64-unknown-linux-gnu ;;
          esac
          url="https://github.com/astral-sh/ruff/releases/download/${RUFF_VERSION}/ruff-${target}.tar.gz"
          curl -fsSL "$url" | tar -xzf - -C /tmp
          sudo install "/tmp/ruff-${target}/ruff" /usr/local/bin/ruff
          ruff --version

      # S603/S607 flag every subprocess call and every command resolved via PATH.
      # bump-deps does both deliberately -- it shells out to `gh`, `gpg`, `shasum`
      # and `chezmoi` by name, which is the point -- so they are ignored here
      # rather than silenced with a noqa on each call site. The narrower S310
      # suppressions stay inline where they are.
      - name: Lint Python with ruff
        run: ruff check --select=E9,F,S --ignore=S603,S607 bin/bump-deps tests/python/

      - name: Self-test bin/bump-deps
        run: python3 bin/bump-deps --self-test

      - name: Shellcheck rendered chezmoi scripts
        run: |
          # .chezmoiscripts/** are Go templates, so they must be rendered before
          # they are valid shell. Use the non-interactive template defaults.
          sh -c "$(curl -fsSL https://get.chezmoi.io)" -- -b "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          chezmoi init --source="$PWD"
          rc=0
          # NB: `find | while read` would run the loop in a subshell and throw
          # away rc. Redirect instead.
          while read -r tmpl; do
            out="/tmp/$(echo "$tmpl" | tr '/' '_').sh"
            chezmoi execute-template < "$tmpl" > "$out"
            # Renders empty on the other platform; the matching matrix leg lints it.
            # Test for no non-whitespace content rather than `[ -s ]`: a template
            # whose guard closes with `{{ end }}` instead of `{{- end -}}` emits a
            # lone newline, which is 1 byte and would otherwise be linted as a
            # shell script with no shebang.
            if [ -z "$(tr -d '[:space:]' < "$out")" ]; then
              echo "skip (empty on $RUNNER_OS): $tmpl"; continue
            fi
            echo "== $tmpl"
            shellcheck "$out" || rc=1
          done < <(find .chezmoiscripts -name '*.tmpl')
          exit $rc

  # Audits the CI configuration itself, which nothing used to look at. Two
  # complementary tools: actionlint for correctness (workflow schema, expression
  # syntax, matrix references -- and it shellchecks `run:` blocks, ~200 lines of
  # shell that no other job sees), zizmor for security (token scope, credential
  # persistence, template injection, action provenance).
  #
  # ubuntu-latest only, deliberately, unlike `lint` and `test`: those are matrixed
  # because the .chezmoiscripts/{darwin,linux} templates render per-OS, whereas
  # workflow analysis is platform-independent. One runner also means one pinned
  # version per tool instead of two.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actionlint shells out to shellcheck for `run:` blocks and silently skips
      # that rule if it is missing. ubuntu-latest ships a shellcheck, but an
      # unpinned one -- the exact drift the `lint` job pins against -- so install
      # the same version here rather than inherit whatever the image has.
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          url="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL "$url" | tar -xJf - -C /tmp
          sudo install "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      # Both tools are pinned to an exact release and tracked by `bump-deps`.
      # No checksum, matching the shellcheck precedent rather than the bats one:
      # bats pins a sha256 because GitHub *source archives* are generated on
      # demand and have been regenerated before, whereas these are immutable
      # uploaded release binaries.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: v1.7.12
        run: |
          v="${ACTIONLINT_VERSION#v}"
          url="https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/actionlint_${v}_linux_amd64.tar.gz"
          curl -fsSL "$url" | tar -xzf - -C /tmp actionlint
          sudo install /tmp/actionlint /usr/local/bin/actionlint
          actionlint --version

      - name: Install zizmor
        env:
          ZIZMOR_VERSION: v1.30.0
        run: |
          url="https://github.com/zizmorcore/zizmor/releases/download/${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "$url" | tar -xzf - -C /tmp zizmor
          sudo install /tmp/zizmor /usr/local/bin/zizmor
          zizmor --version

      # Explicit paths, not a bare directory: if a glob ever stops matching, an
      # empty file list would otherwise read as "clean".
      - name: actionlint
        run: actionlint -verbose .github/workflows/ci.yaml .github/workflows/deps.yaml

      # GH_TOKEN is not optional. Without it zizmor drops every online audit --
      # impostor-commit, ref-version-mismatch, stale-action-refs,
      # known-vulnerable-actions -- and still exits 0. The canary below is what
      # notices if that ever happens.
      - name: zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: zizmor .github/workflows/

      # Prove the online audits actually ran, rather than trusting that they did.
      # The fixture pins a real commit under a deliberately wrong version comment,
      # so ref-version-mismatch must fire; if it doesn't, either the token is
      # missing or the audit regressed, and in both cases the step above became
      # decoration.
      #
      # --no-exit-codes matters: a finding here is the *expected* result, but
      # zizmor still exits 13 for it, and `bash -e` would kill the step before
      # the assertion below ever ran. (zizmor's docs say --format=json already
      # suppresses those codes. As of v1.28.0 it does not.) The real scan above
      # keeps its exit-code gate.
      - name: Assert zizmor's online audits ran
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          zizmor --no-exit-codes --format=json tests/fixtures/zizmor/canary.yml > /tmp/canary.json
          python3 - <<'PY'
          import json, sys

          with open("/tmp/canary.json") as fh:
              idents = {f["ident"] for f in json.load(fh)}
          if "ref-version-mismatch" not in idents:
              sys.exit(
                  "canary did not fire: expected ref-version-mismatch, got "
                  f"{sorted(idents) or 'nothing'}.\n"
                  "zizmor's online audits are not running -- check GH_TOKEN."
              )
          print("canary fired; online audits are live")
          PY

  # Behavioral tests, as opposed to the parse-only checks in `lint`. Matrixed
  # for the same reason: bin/secret is macOS-facing but must still be provably
  # correct when its `security` calls are stubbed, and the template suite renders
  # the darwin and linux .chezmoiscripts templates on their respective runners.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned to an upstream release rather than each platform's package
      # manager, for the same reason shellcheck is: Ubuntu's apt `bats` trails
      # Homebrew's `bats-core` by several minor versions and they disagree about
      # which helpers exist, so an unpinned gate passes on one runner and fails
      # on the other for identical code.
      #
      # The checksum is verified rather than assumed. GitHub's source archives
      # are generated on demand and have been regenerated once (2023), so if this
      # ever fails with an unchanged tag, check for that before assuming the
      # worst -- then recompute with:
      #   curl -fsSL <url> | shasum -a 256
      # Bump the tag with: bin/bump-deps (it is registered as a VERSION pin).
      - name: Install bats-core
        env:
          BATS_VERSION: v1.14.0
          BATS_SHA256: bb537b70b15b732f6d8827dd6578e3d8ce166636ce1f18ea9a074184fcce9177
        run: |
          url="https://github.com/bats-core/bats-core/archive/refs/tags/${BATS_VERSION}.tar.gz"
          curl -fsSLo /tmp/bats.tar.gz "$url"
          echo "${BATS_SHA256}  /tmp/bats.tar.gz" | shasum -a 256 -c -
          tar -xzf /tmp/bats.tar.gz -C /tmp
          sudo "/tmp/bats-core-${BATS_VERSION#v}/install.sh" /usr/local
          bats --version

      # jq because herdr-reload-all's behavior largely IS its jq filters, so they
      # are exercised for real rather than stubbed. zsh because the bundle that
      # `secret env` produces is eval'd by zsh in actual use -- the bash leg of
      # that round-trip does not prove the zsh leg, which is the whole reason
      # bin/secret hand-rolls its quoting instead of using printf %q. Ubuntu
      # runners ship neither; macOS ships both.
      - name: Install jq and zsh
        run: |
          missing=""
          for tool in jq zsh; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            if [ "$RUNNER_OS" != "Linux" ]; then
              echo "missing:$missing and no install path for $RUNNER_OS" >&2
              exit 1
            fi
            # shellcheck disable=SC2086
            sudo apt-get update && sudo apt-get install -y $missing
          fi
          jq --version
          zsh --version

      # templates.bats shells out to `chezmoi execute-template`. Without chezmoi
      # those tests skip rather than fail, which would quietly hollow out the
      # suite -- so install it explicitly.
      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsSL https://get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The suite runs once; the skip check reads its output rather than running
      # it again. A missing jq/zsh/chezmoi makes the affected tests skip rather
      # than fail -- deliberate, so the suite stays runnable on a half-configured
      # laptop -- but on a runner a skip means the job silently tested less than
      # it claims, so it is an error here.
      - name: Run the test suite
        run: |
          set -o pipefail
          ./tests/run 2>&1 | tee /tmp/testlog
      - name: Assert nothing was skipped
        run: |
          if grep -E '^ok .*# skip' /tmp/testlog; then
            echo "tests skipped above; a dependency is missing on this runner" >&2
            exit 1
          fi
          echo "no skipped tests"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks needs history, not just the tip commit.
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This action comments on PRs by default, which needs
          # pull-requests: write. The job already fails the build on a finding,
          # so the comment adds nothing a red check doesn't -- and declining it
          # keeps this job at contents: read.
          GITLEAKS_ENABLE_COMMENTS: "false"

  # Apply the tree from THIS commit. Previously this job cloned master from
  # GitHub and discarded the checkout, so pull requests never tested their own
  # code.
  apply:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stage the checkout as the chezmoi source directory
        run: |
          mkdir -p "$HOME/.local/share"
          cp -R "$GITHUB_WORKSPACE" "$HOME/.local/share/chezmoi"

      - name: Install and apply
        # Invoked directly, not via `bash <path>`: install.sh locates its own
        # source directory with `command -v -- "$0"`, which only resolves an
        # absolute path when the file is executable. This matches how
        # scripts/install_dotfiles.sh execs it.
        #
        # Single-quoted on the YAML side so the double quotes survive into the
        # shell. Written as "$HOME/..." the YAML parser consumes the quotes and
        # bash receives the path bare, splitting it on any space in $HOME.
        run: '"$HOME/.local/share/chezmoi/install.sh"'

      - name: Apply a second time (idempotence)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          chezmoi apply

      - name: Verify no drift
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # Not `chezmoi verify`: the four plain run_after_ scripts are meant to
          # run on every apply, so they are permanently "pending" and verify can
          # never exit 0. Assert instead that no managed *file* differs from its
          # target after two applies -- which is what idempotence means here.
          drift=$(chezmoi status --exclude=scripts)
          if [ -n "$drift" ]; then
            echo "Drift after second apply:"
            echo "$drift"
            exit 1
          fi
          echo "No drift."

  # Exercises the documented `curl | bash` path end to end. Unlike `apply`, this
  # actually runs scripts/install_dotfiles.sh -- the Homebrew-on-PATH fix, the
  # DOTFILES_FORCE_RESET gate and the Xcode CLI tools check live there and are
  # otherwise only shellchecked, never executed.
  #
  # install_dotfiles.sh clones DOTFILES_BRANCH from DOTFILES_USER's repo rather
  # than using the checkout, so it can only test a branch that exists on the
  # upstream remote. That holds for pushes and for same-repo pull requests, but
  # not for forks -- GITHUB_HEAD_REF there names a branch on the fork. Hence the
  # not-a-fork guard rather than push-only.
  #
  # Note this still cannot reproduce the Apple Silicon PATH bug: GitHub's macOS
  # runners ship Homebrew already on PATH. That needs a clean VM.
  bootstrap:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the documented curl | bash bootstrap
        env:
          # GITHUB_HEAD_REF is set only for pull_request events; fall back to the
          # pushed ref so a push to master tests master.
          DOTFILES_BRANCH: ${{ github.head_ref || github.ref_name }}
          # A fresh runner has no source directory, so this is a no-op today. Set
          # anyway so the job keeps its clean-slate semantics if a runner image
          # ever ships one, rather than failing the dirty-tree check.
          DOTFILES_FORCE_RESET: "1"
        run: bash scripts/install_dotfiles.sh
